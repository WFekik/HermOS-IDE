name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coordination note (Agent 3 / tauri.conf.json): tauri.conf.json's
          # bundle.targets lists all six installer types, so each OS would try
          # (and fail) to build every type. These explicit --bundles flags
          # restrict each runner to only its own installer formats.
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Fetch Intel query engine for the universal macOS bundle
        if: matrix.platform == 'macos-latest'
        run: node scripts/ensure-extra-prisma-engines.mjs darwin

      - name: Build Tauri Desktop & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: 'HermOS IDE ${{ inputs.release_tag || github.ref_name }}'
          releaseBody: |
            ### HermOS IDE ${{ inputs.release_tag || github.ref_name }} — Local-First AI Agent Desktop IDE
            
            #### 📦 Downloads
            - **Windows**: grab the `.msi` under Assets (also `.exe` NSIS installer)
            - **macOS**: grab the universal `.dmg` under Assets (Apple Silicon & Intel)
            - **Linux**: grab the `.deb` or `.AppImage` under Assets
            
            #### 🛡️ Highlights
            - 100% Local-first architecture with zero remote telemetry.
            - Model Context Protocol (MCP v1.30) & Subagent parallel execution.
            - Universal Model Keyrings (Ollama, Anthropic Claude, Groq, NVIDIA NIM, OpenAI).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

