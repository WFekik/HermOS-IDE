<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HermOS IDE</title>
<!-- COUPLING: this splash relies on Tauri CSP allowing inline style+script
  (tauri.conf.json: style-src/script-src 'unsafe-inline'). It loads via the
  tauri:// App protocol, NOT the Next.js headers() CSP. Dropping
  'unsafe-inline' from the Tauri CSP blanks this frameless window. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a; color: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag; user-select: none;
  }
  .wrap { text-align: center; padding: 32px; }
  .logo { width: 76px; height: 76px; margin: 0 auto 20px; display: block; filter: drop-shadow(0 0 22px rgba(16,185,129,.35)); }
  .logo .z-breathe { animation: breathe 2.5s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  p.sub { margin-top: 8px; font-size: 13px; color: #888; }
  .bar { width: 220px; height: 3px; margin: 24px auto 0; background: #222; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 40%; background: #10B981; border-radius: 99px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(550%);} }
  .status { margin-top: 14px; font-size: 12px; color: #666; min-height: 16px; }
  @media (prefers-color-scheme: light) {
    body { background: #ffffff; color: #111; }
    p.sub { color: #666; } .bar { background: #eee; } .status { color: #999; }
  }
</style>
</head>
<body>
<div class="wrap">
  <svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><g><path d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03C28.51,26.72,26.72,28.51,24.51,28.51z" fill="#101010" stroke="#2D2D2D" stroke-width="0.6317"/><g class="z-breathe"><path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z" fill="#FFFFFF"/><polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1" fill="#FFFFFF"/><path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z" fill="#10B981"/></g></g></svg>
  <h1>HermOS IDE</h1>
  <p class="sub">Starting local engine…</p>
  <div class="bar"><div></div></div>
  <div class="status" id="st">Booting backend</div>
</div>
<script>
(function(){
  var msgs = ["Booting backend", "Warming workspace", "Almost there"];
  var i = 0, el = document.getElementById("st");
  var t = setInterval(function(){
    i = (i + 1) % msgs.length;
    if (el) el.textContent = msgs[i];
  }, 1200);
  window.addEventListener("beforeunload", function(){ clearInterval(t); });
})();
</script>
</body>
</html>
