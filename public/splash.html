<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HermOS IDE</title>
<!-- COUPLING: this splash relies on Tauri CSP allowing inline style+script
  (tauri.conf.json: style-src/script-src 'unsafe-inline'). It loads via the
  tauri:// App protocol, NOT the Next.js headers() CSP. Dropping
  'unsafe-inline' from the Tauri CSP blanks this frameless window. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #040705;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    user-select: none;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  /* Ambient radial backdrop */
  .backdrop-glow {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.16) 0%, rgba(16, 185, 129, 0.04) 45%, transparent 70%);
    filter: blur(28px);
    pointer-events: none;
    animation: ambient-pulse 4.5s ease-in-out infinite alternate;
  }

  /* Antigravity floating logo wrapper */
  .logo-stage {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: antigravity-float 4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
  }

  .logo-aura {
    position: absolute;
    inset: -6px;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(52, 211, 153, 0.1));
    filter: blur(14px);
    opacity: 0.5;
    animation: aura-breathe 4s ease-in-out infinite alternate;
  }

  .logo {
    position: relative;
    width: 92px;
    height: 92px;
    display: block;
    filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 18px rgba(16, 185, 129, 0.25));
  }

  /* Fluid stroke shimmer */
  .stroke-glow {
    animation: stroke-pulse 4s ease-in-out infinite alternate;
  }

  /* Beacon pulse */
  .beacon {
    animation: beacon-glow 2s ease-in-out infinite alternate;
  }

  @keyframes antigravity-float {
    0% {
      transform: translateY(4px) scale(0.985);
    }
    100% {
      transform: translateY(-5px) scale(1.015);
    }
  }

  @keyframes ambient-pulse {
    0% {
      opacity: 0.4;
      transform: scale(0.92);
    }
    100% {
      opacity: 0.8;
      transform: scale(1.08);
    }
  }

  @keyframes aura-breathe {
    0% {
      opacity: 0.35;
      transform: scale(0.95);
    }
    100% {
      opacity: 0.75;
      transform: scale(1.05);
    }
  }

  @keyframes stroke-pulse {
    0% {
      stroke: #10B981;
      filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.4));
    }
    100% {
      stroke: #34D399;
      filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.8));
    }
  }

  @keyframes beacon-glow {
    0% {
      opacity: 0.5;
      transform-origin: 46px 69px;
      transform: scale(0.85);
    }
    100% {
      opacity: 0.95;
      transform-origin: 46px 69px;
      transform: scale(1.15);
    }
  }

  /* Frameless window chrome */
  .chrome {
    position: fixed;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 2px;
    padding: 6px;
    opacity: 0.4;
    transition: opacity 160ms ease;
    -webkit-app-region: no-drag;
  }
  .chrome:hover {
    opacity: 1;
  }
  .chrome.right { right: 0; }
  .chrome.left { left: 0; flex-direction: row; }
  .chrome button {
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 0;
    border-radius: 6px;
    color: #737373;
    cursor: default;
    -webkit-app-region: no-drag;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .chrome button:enabled { cursor: pointer; color: #a3a3a3; }
  .chrome button:enabled:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
  .chrome button.close:enabled:hover { background: #e81123; color: #ffffff; }
  .chrome button:focus-visible { outline: 1.5px solid #10B981; outline-offset: -2px; }
  .chrome button:disabled { opacity: 0.35; }
  .chrome.mac button { width: 36px; }
  .chrome.mac .dot { width: 11px; height: 11px; border-radius: 99px; display: block; }

  /* Screen reader only live status */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .backdrop-glow, .logo-stage, .logo-aura, .stroke-glow, .beacon {
      animation: none !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
<div class="chrome right" id="chrome-win" data-tauri-drag-region="false" aria-label="Window controls">
  <button type="button" id="btn-min" aria-label="Minimize" data-tauri-drag-region="false" disabled><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  <button type="button" id="btn-max" aria-label="Maximize" data-tauri-drag-region="false" disabled><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button type="button" id="btn-close" class="close" aria-label="Close" data-tauri-drag-region="false" disabled><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
</div>
<div class="chrome left mac" id="chrome-mac" data-tauri-drag-region="false" aria-label="Window controls" hidden>
  <button type="button" id="btn-close-mac" class="close" aria-label="Close" data-tauri-drag-region="false" disabled><span class="dot" style="background:#FF5F57"></span></button>
  <button type="button" id="btn-min-mac" aria-label="Minimize" data-tauri-drag-region="false" disabled><span class="dot" style="background:#FEBC2E"></span></button>
  <button type="button" id="btn-max-mac" aria-label="Maximize" data-tauri-drag-region="false" disabled><span class="dot" style="background:#28C840"></span></button>
</div>

<div class="backdrop-glow" aria-hidden="true"></div>

<div class="logo-stage">
  <div class="logo-aura"></div>
  <svg class="logo" viewBox="0 0 92 92" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="HermOS IDE">
    <!-- Outer rounded squircle -->
    <rect width="92" height="92" rx="22" fill="#070C09" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect x="1.5" y="1.5" width="89" height="89" rx="20.5" stroke="url(#border-grad)" stroke-width="1.2"/>
    <!-- Monogram H -->
    <path class="stroke-glow" d="M29 23v46M63 23v46M29 46h34" stroke="url(#herm-grad)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Orbit beacon -->
    <circle class="beacon" cx="46" cy="69" r="4" fill="#34D399"/>
    <defs>
      <linearGradient id="herm-grad" x1="29" y1="23" x2="63" y2="69" gradientUnits="userSpaceOnUse">
        <stop stop-color="#34D399"/>
        <stop offset="0.5" stop-color="#10B981"/>
        <stop offset="1" stop-color="#059669"/>
      </linearGradient>
      <linearGradient id="border-grad" x1="0" y1="0" x2="92" y2="92" gradientUnits="userSpaceOnUse">
        <stop stop-color="rgba(52,211,153,0.3)"/>
        <stop offset="0.5" stop-color="rgba(16,185,129,0.12)"/>
        <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<!-- Accessible screen-reader live status -->
<div id="st" role="status" aria-live="polite" class="sr-only">HermOS IDE is initializing...</div>

<script src="./tauri-window-controls.js" defer></script>
</body>
</html>
